name: Deploy docs site

# Builds the static site from the markdown sources and publishes it to GitHub
# Pages. Nothing is committed to the repo — the site is built fresh on every
# push, so there is no output folder to select in the repo settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned deliberately: every in-page anchor link depends on the `toc`
      # extension's slug algorithm, so a minor bump could silently break them.
      - name: Install dependencies
        run: pip install "markdown==3.7"

      - name: Build site
        run: python build_site.py --clean --out _site

      # enablement: true turns Pages on for the repo on the first run, so the
      # only manual step is setting Source to "GitHub Actions" if it is not
      # already (and on many repos this call handles even that).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
