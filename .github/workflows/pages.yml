name: Deploy docs site

# Builds the static site from the markdown sources and publishes it to GitHub
# Pages. Nothing is committed to the repo — the site is built fresh on every
# push, so there is no output folder to select in the repo settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Unlike CI, an in-flight *production* deploy is allowed
# to finish rather than being superseded by a newer push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pinned deliberately: every in-page anchor link depends on the `toc`
      # extension's slug algorithm, so a minor bump could silently break them.
      - name: Install dependencies
        run: pip install "markdown==3.7"

      - name: Build site
        run: python build_site.py --clean --out _site

      # Requires Pages to already be enabled with Source = "GitHub Actions"
      # (Settings -> Pages). It cannot enable Pages itself: creating the Pages
      # site needs permissions the default GITHUB_TOKEN does not carry, so
      # `enablement: true` only ever fails with "Resource not accessible by
      # integration".
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
